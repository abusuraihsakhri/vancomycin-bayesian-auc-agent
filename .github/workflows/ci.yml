name: Tests and packaging

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents vancomycin_bayesian_auc_agent vanco_bayes.py enrichment.py
      - name: Python regression suite
        run: python -m pytest -q
      - name: Static browser calculations (Node)
        run: node --test web/calculator.test.cjs
      - name: Package build validation
        run: |
          python -m pip install build
          python -m build
